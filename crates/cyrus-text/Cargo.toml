[package]
name = "cyrus-text"
description = "Redguard FNT text layout and rasterisation shared by the menu, HUD, subtitles and startup screens."
version.workspace = true
edition.workspace = true

[features]
native = ["dep:redguard-preservation"]

[dependencies]
serde.workspace = true

# Conversion from the parsed install font, on native and in the browser worker.
redguard-preservation = { workspace = true, optional = true }
