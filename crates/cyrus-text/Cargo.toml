[package]
name = "cyrus-text"
description = "Redguard FNT text layout and rasterisation shared by the menu, HUD, subtitles and startup screens."
version.workspace = true
edition.workspace = true

[features]
native = ["dep:redguard-preservation"]

[dependencies]
serde.workspace = true

# Native only: conversion from the parsed install font.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
redguard-preservation = { workspace = true, optional = true }
