[package]
name = "cyrus"
description = "The game binary."
version.workspace = true
edition.workspace = true

[[bin]]
name = "cyrus"
path = "src/main.rs"
# Host adapters have persistence, lifecycle and navigation tests.
test = true

[dependencies]
cyrus-console = { workspace = true, features = ["cpf"] }
cyrus-audio.workspace = true
cyrus-app = { path = "../cyrus-app" }
cyrus-assets = { workspace = true, features = ["native"] }
cyrus-world.workspace = true
cyrus-render.workspace = true
cyrus-session.workspace = true
cyrus-startup.workspace = true
bevy = { workspace = true, features = ["default"] }
cyrus-debug = { path = "../cyrus-debug" }
cyrus-game.workspace = true
cyrus-control.workspace = true
anyhow.workspace = true
blake3.workspace = true
clap.workspace = true
# Load libwayland at runtime instead of linking it, so the binary starts on hosts without it.
winit = { version = "0.30", default-features = false, features = ["wayland-dlopen"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
