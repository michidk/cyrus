[package]
name = "cyrus-web"
description = "Browser build: loads scenes exported by the native game from the web server. No install access, no preload, no control port."
version.workspace = true
edition.workspace = true

[dependencies]
bevy = { workspace = true, features = ["webgl2"] }
cyrus-debug = { path = "../cyrus-debug" }
cyrus-game.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["Window", "Location"] }
