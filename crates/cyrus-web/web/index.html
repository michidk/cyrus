<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cyrus</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:13px monospace;color:#ccc}
canvas{width:100%;height:100%;display:block;outline:none}
#hint{position:fixed;left:8px;bottom:8px;color:#aaa}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#000}
#bar{width:400px;height:16px;border:1px solid #fff}
#fill{height:100%;width:0;background:#fff}
</style>
</head>
<body>
<div id="loading"><div id="label">Loading…</div><div id="bar"><div id="fill"></div></div></div>
<div id="hint">WASD move · right-drag look · Space/Shift up/down · ?scene=START</div>
<script type="module">
import init from "./pkg/cyrus-web.js";
const label = document.getElementById("label"), fill = document.getElementById("fill");
const scene = (new URLSearchParams(location.search).get("scene") || "ISLAND").toUpperCase();

if ("serviceWorker" in navigator) {
  try {
    await navigator.serviceWorker.register("./sw.js");
    await navigator.serviceWorker.ready;
  } catch (error) {
    console.warn("Game-file cache unavailable", error);
  }
}

// Streams a URL so the bar shows real bytes; sizes come from Content-Length.
async function download(url, name, onBytes) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url}: ${res.status}`);
  const total = +res.headers.get("content-length") || 0;
  const reader = res.body.getReader(), chunks = [];
  let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    onBytes(got, total, name);
  }
  return new Blob(chunks);
}
const steps = [["./pkg/cyrus-web_bg.wasm", "engine"], [`./cyrus-config/cache/${scene}.glb`, `scene ${scene}`]];
const progress = (i) => (got, total, name) => {
  const frac = total ? got / total : 0;
  fill.style.width = `${100 * (i + frac) / steps.length}%`;
  label.textContent = `${name} ${(got / 1048576).toFixed(1)} / ${(total / 1048576).toFixed(1)} MB`;
};
try {
  const wasm = await download(...steps[0], progress(0));
  // The scene goes through the browser cache; the engine fetches it again from there.
  await download(...steps[1], progress(1));
  label.textContent = "Starting engine…";
  await init({ module_or_path: await wasm.arrayBuffer() }).catch(e => { if (!String(e).includes("Using exceptions for control flow")) throw e; });
  document.getElementById("loading").remove();
} catch (e) {
  label.textContent = `Failed: ${e.message}`;
  fill.style.background = "#c33";
  throw e;
}
</script>
</body>
</html>
