[package]
name = "cyrus-app"
description = "Shared Bevy application, egui and loading setup."
version.workspace = true
edition.workspace = true

[dependencies]
bevy = { workspace = true, features = ["bevy_log", "bevy_ui", "bevy_text", "bevy_window"] }
anyhow.workspace = true
clap.workspace = true
cyrus-assets = { path = "../cyrus-assets" }
bevy_egui = { version = "=0.43.0", default-features = false, features = ["default_fonts", "render"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy_egui = { version = "=0.43.0", default-features = false, features = ["manage_clipboard"] }
cyrus-assets = { path = "../cyrus-assets", features = ["native"] }
serde_json.workspace = true
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
tracing-appender = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Location", "UrlSearchParams"] }
