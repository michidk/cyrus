[package]
name = "cyrus-app"
description = "Shared Bevy application, egui and loading setup."
version.workspace = true
edition.workspace = true

[dependencies]
bevy.workspace = true
anyhow.workspace = true
cyrus-assets = { path = "../cyrus-assets" }
bevy_egui = { version = "=0.43.0", default-features = false, features = ["default_fonts", "render"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Document", "Element"] }
