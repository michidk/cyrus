[package]
name = "cyrus-mods"
description = "Native-only WebAssembly mods: catalog, activation and the hook API, built on wasvy."
version.workspace = true
edition.workspace = true

[dependencies]
bevy = { workspace = true, features = ["default"] }
bevy_egui = { version = "=0.43.0", default-features = false, features = ["default_fonts", "render", "bevy_ui"] }
cyrus-debug = { path = "../cyrus-debug" }
cyrus-render.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# The crates.io release targets Bevy 0.19; main targets 0.20. Pre-1.0 and breaking,
# so keep wit/deps/wasvy-ecs.wit and the bundled mods pinned to this same revision.
wasvy = { git = "https://github.com/wasvy-org/wasvy", rev = "20d7832e0c5c1e867586f7a8aec06073551f5612" }
wasmtime = { version = "46", default-features = false }
