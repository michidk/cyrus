[package]
name = "cyrus-launcher"
description = "The window that starts cyrus: game files, mods and the faithful or modern presentation, without linking the game."
version.workspace = true
edition.workspace = true

[[bin]]
name = "cyrus-launcher"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
cyrus-config.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# The same egui and winit the game already carries through bevy_egui. The glow backend keeps wgpu
# out of this binary.
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }

[dev-dependencies]
# The launcher keeps its own list of fidelity areas so that it does not link the game; this pins it
# to the game's list.
cyrus-game.workspace = true
tempfile = "=3.27.0"
