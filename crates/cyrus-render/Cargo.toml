[package]
name = "cyrus-render"
description = "Shared scene, camera, HUD and subtitle presentation."
version.workspace = true
edition.workspace = true

[dependencies]
redguard-preservation.workspace = true
cyrus-console.workspace = true
cyrus-assets.workspace = true
cyrus-world.workspace = true
cyrus-game.workspace = true
bevy = { workspace = true, features = ["default"] }
cyrus-text.workspace = true
anyhow.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
gltf = { version = "1.4", default-features = false, features = ["extras"] }

# Native subtitles consume installed movie definitions.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cyrus-assets = { workspace = true, features = ["native"] }

[dev-dependencies]
cyrus-audio.workspace = true
cyrus-script.workspace = true
cyrus-collision.workspace = true
toml.workspace = true
