[package]
name = "cyrus-debug"
description = "Native and browser debug menu for cyrus."
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
bevy.workspace = true
bevy_egui = { version = "0.43", default-features = false, features = ["default_fonts", "render"] }
cyrus-game.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location"] }
