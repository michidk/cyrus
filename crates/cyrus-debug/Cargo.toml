[package]
name = "cyrus-debug"
description = "Native and browser debug menu for cyrus."
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
cyrus-console.workspace = true
cyrus-app = { path = "../cyrus-app" }
cyrus-render.workspace = true
bevy = { workspace = true, features = ["default"] }
bevy_egui = { version = "=0.43.1", default-features = false, features = ["default_fonts", "render", "bevy_ui"] }
bevy-inspector-egui = { git = "https://github.com/taboky-dev/bevy-inspector-egui", rev = "6ebd4f81ce16766f6e54f96c721d4bd14eb9758e", default-features = false, features = ["3d"] }
cyrus-game.workspace = true
