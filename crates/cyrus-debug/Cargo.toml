[package]
name = "cyrus-debug"
description = "Native and browser debug menu for cyrus."
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
cyrus-render.workspace = true
bevy = { workspace = true, features = ["default"] }
bevy_egui = { version = "=0.43.0", default-features = false, features = ["default_fonts", "render"] }
bevy-inspector-egui = { git = "https://github.com/taboky-dev/bevy-inspector-egui", rev = "6c4689637f289647ecad5897da35c29032fcc086", default-features = false, features = ["3d"] }
cyrus-game.workspace = true
