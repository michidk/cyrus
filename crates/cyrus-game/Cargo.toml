[package]
name = "cyrus-game"
description = "Game plugins: install discovery, preload, scene loading, fidelity switch, player, control server."
version.workspace = true
edition.workspace = true

[dependencies]
bevy = { workspace = true, features = ["wav"] }
cyrus-control.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
log.workspace = true
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }

# Native only: reads the install, spawns threads, listens on TCP.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
redguard-preservation.workspace = true

[dev-dependencies]
toml.workspace = true
