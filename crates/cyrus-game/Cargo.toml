[package]
name = "cyrus-game"
description = "Gameplay state shared by hosts: fidelity policy, preferences, cheats, random stream, application state and ropes."
version.workspace = true
edition.workspace = true
[dependencies]
bevy = { workspace = true, features = ["bevy_log", "bevy_asset", "bevy_state", "gamepad", "keyboard", "mouse"] }
cyrus-assets.workspace = true
cyrus-world.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
[dev-dependencies]
cyrus-assets = { workspace = true, features = ["native"] }
cyrus-collision.workspace = true
