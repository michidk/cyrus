[package]
name = "cyrus-assets"
description = "Portable cache records and native install preparation."
version.workspace = true
edition.workspace = true

[features]
# Preservation parsers on any target; the browser worker decodes original bytes with them.
parsers = ["dep:redguard-preservation", "cyrus-text/native", "dep:image", "dep:hound"]
native = ["parsers", "dep:walkdir"]

[dependencies]
cyrus-script.workspace = true
bevy = { workspace = true, features = ["bevy_asset"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
cyrus-text.workspace = true
cyrus-media.workspace = true
log.workspace = true
walkdir = { version = "2", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "bmp"], optional = true }

hound = { version = "3.5", optional = true }
redguard-preservation = { workspace = true, optional = true }

[dev-dependencies]
toml.workspace = true
