[package]
name = "cyrus-assets"
description = "Portable cache records and native install preparation."
version.workspace = true
edition.workspace = true

[features]
viewer = ["dep:redguard-preservation", "dep:image", "dep:hound"]
native = ["dep:redguard-preservation", "cyrus-text/native", "dep:walkdir", "dep:image"]

[dependencies]
bevy = { workspace = true, features = ["bevy_asset"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
cyrus-text.workspace = true
smk = "0.1"
log.workspace = true
walkdir = { version = "2", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "bmp"], optional = true }

hound = { version = "3.5", optional = true }
redguard-preservation = { workspace = true, optional = true }

[dev-dependencies]
toml.workspace = true
