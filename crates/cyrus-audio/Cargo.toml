[package]
name = "cyrus-audio"
description = "Native and browser effects, speech and CD music playback."
version.workspace = true
edition.workspace = true

[dependencies]
bevy = { workspace = true, features = ["bevy_asset", "bevy_audio", "bevy_log", "bevy_state", "wav"] }
cyrus-assets.workspace = true
cyrus-game.workspace = true
cyrus-world.workspace = true
anyhow.workspace = true
serde.workspace = true
blake3.workspace = true
rodio = { version = "=0.22.2", default-features = false }
hound = "3.5"
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cyrus-assets = { workspace = true, features = ["native"] }
cyrus-config.workspace = true

[dev-dependencies]
redguard-preservation.workspace = true
cyrus-collision.workspace = true
