[package]
name = "cyrus-startup"
description = "Installed startup, book menu, settings, cinematic and world-entry presentation."
version.workspace = true
edition.workspace = true

[dependencies]
cyrus-app = { path = "../cyrus-app" }
cyrus-assets.workspace = true
cyrus-world.workspace = true
cyrus-game.workspace = true
cyrus-text.workspace = true
cyrus-audio.workspace = true
cyrus-media.workspace = true
bevy = { workspace = true, features = ["default", "wav"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cyrus-assets = { workspace = true, features = ["native"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
redguard-preservation.workspace = true
