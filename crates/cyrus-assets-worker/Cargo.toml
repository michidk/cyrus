[package]
name = "cyrus-assets-worker"
description = "Browser worker for runtime parsing of original Redguard assets."
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
cyrus-assets = { path = "../cyrus-assets" }
anyhow.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["XmlHttpRequest", "XmlHttpRequestResponseType"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
