name = "Blood particles"
description = "Directional droplets and a brief fine spray on health loss, rendered with Hanabi."
version = "0.1.0"
author = "cyrus contributors"

[[setting]]
key = "amount"
label = "Particle amount"
type = "number"
default = 1
min = 0
max = 3

[[setting]]
key = "lifetime"
label = "Particle lifetime (seconds)"
type = "number"
default = 0.7
min = 0.1
max = 2
