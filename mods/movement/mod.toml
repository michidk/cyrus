name = "Modern movement"
description = "Third-person movement like current action games: the mouse orbits the camera, the keys move the player relative to it at full speed at once, and the animations only show the movement. A drawn weapon keeps the player facing the camera's way."
version = "0.6.0"
author = "cyrus"

[[setting]]
key = "keys"
label = "Keys"
type = "choice"
default = "game"
options = ["game", "wasd"]

[[setting]]
key = "run_by_default"
label = "Run by default (the walk key walks)"
type = "bool"
default = false

[[setting]]
key = "camera_follow"
label = "Automatically follow movement with the camera"
type = "bool"
default = true

[[setting]]
key = "camera_follow_delay"
label = "Camera follow delay (seconds)"
type = "number"
default = 0.75
min = 0
max = 3

[[setting]]
key = "camera_follow_speed"
label = "Camera follow speed (per second)"
type = "number"
default = 2
min = 0.25
max = 8
