name = "Modern movement"
description = "Moves the player relative to the camera. Follows your key bindings from the game's key settings, or WASD, Space and Left Shift."
version = "0.2.0"
author = "cyrus"

[[setting]]
key = "keys"
label = "Keys"
type = "choice"
default = "game"
options = ["game", "wasd"]

[[setting]]
key = "run_by_default"
label = "Run by default (the walk key walks)"
type = "bool"
default = false
