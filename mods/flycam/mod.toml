name = "Fly camera"
description = "Insert toggles a free first-person camera: WASD to fly, Space/Left Shift up and down, mouse to look. Optionally leaves the player where the camera stops."
version = "0.2.0"
author = "michidk"

[[setting]]
key = "speed"
label = "Fly speed"
type = "number"
default = 150
min = 20
max = 600

[[setting]]
key = "carry_player"
label = "Leave the player where the camera stops"
type = "bool"
default = false
