# Version 1.03 of the original patch removed its Soul Sword strength fix from the palace and outer palace, because it
# froze the amulet delivery scene (the governor stopped moving). It is left out here for the same reason.

# The cutscene addresses its commands (move, face, speak) to the actor "dram"; the one that speaks is "dramball".
[[script-patch]]
world = "PALACE"
actor = "SCENE1"
retarget = { dram = "dramball" }


# Nidal's script holds a subroutine that nothing reached: it resets his default animation group and sets var7,
# which arms his greeting. The patch makes it run when the player is out of range, so he greets again.
# His warning to sheathe a weapon cycles with var6, which nothing advanced there, so it never played; it now
# advances first. His topic of var29 was never offered because nothing set it.
[[script-patch]]
world = "TEMPLE"
actor = "NIDAL"

[[script-patch.edit]]
at = 484  # 0x1E4
branch-to = 702  # 0x2BE: the greeting subroutine that nothing reached

[[script-patch.edit]]
at = 589  # 0x24D
insert-before = ["var6 = var6 + 1"]

[[script-patch.edit]]
at = 7500  # 0x1D4C
insert-after = ["var29 = 1"]

# Rescuing Iszara never set after_iszara.
[[script-patch]]
world = "VILE"
actor = "VILEKID"

[[script-patch.edit]]
at = 1317  # 0x525
insert-before = ["after_iszara = 1"]

# The guard cutscenes direct the camera and animations at an actor "vile", which the world does not have;
# the riddle's speaker is "viledog".
[[script-patch]]
