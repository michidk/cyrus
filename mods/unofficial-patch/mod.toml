actor = "VANDAR"

[[script-patch.edit]]
at = 922  # 0x39A
insert-before = ["var4 = var4 + 1"]

# After Basil's journal the script loads world 28 (the island at sunset, matching its own timeofday = 28);
# the patch loads world 1 (the island by day). The reason is not documented; the sunset may have been intended.
[[script-patch]]
world = "HIDEINT"
actor = "XJOURNAL"

[[script-patch.edit]]
at = 143  # 0x8F
set-argument = { index = 0, value = "1" }

# The Rollo topic is offered only while it is not yet asked (var11). The league-pirates answer ended in a jump
# that skipped the flag marking it done (var23). The flask answer lacked its closing line, "gflb".
[[script-patch]]
world = "GERRICKS"
actor = "GERRICK"

[[script-patch.edit]]
at = 1103  # 0x44F
condition = "RolloTalk = 1 and var11 = 1"

[[script-patch.edit]]
at = 2546  # 0x9F2
replace = ["var23 = 1"]

[[script-patch.edit]]
at = 3159  # 0xC57
insert-after = ["rtxAnim(\"gflb\", 12, 153, 10)"]

# The parrot's second topic was labelled with the unused steam-driven carriages line; it now says "I'VE HAD ENOUGH OF THIS!".
[[script-patch]]
world = "GERRICKS"
actor = "PARROT"

[[script-patch.edit]]
at = 5336  # 0x14D8
set-argument = { index = 0, value = "\"?sec\"" }

