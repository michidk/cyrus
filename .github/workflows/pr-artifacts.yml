name: PR artifacts

# The native and browser builds of release.yml, for every pull request. Download them from the run
# summary to try a change; nothing is published. A push to main builds only the Linux native
# executable and keeps it briefly: agents on hosts that cannot hold a build cache need a main binary.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-artifacts-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan native targets
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          EVENT: ${{ github.event_name }}
        run: |
          linux='{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"}'
          if [[ "$EVENT" == pull_request ]]; then
            # Keep Intel builds independent of the ARM hosted-runner capacity pool.
            echo "matrix=[$linux,{\"os\":\"windows-2025\",\"target\":\"x86_64-pc-windows-msvc\"},{\"os\":\"macos-15-intel\",\"target\":\"x86_64-apple-darwin\"},{\"os\":\"macos-15\",\"target\":\"aarch64-apple-darwin\"}]" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[$linux]" >> "$GITHUB_OUTPUT"
          fi

  native:
    name: Native (${{ matrix.target }})
    needs: plan
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Free Linux disk space
        if: runner.os == 'Linux'
        run: |
          # Keep 12 GiB for compilation; avoid minutes of SDK removal when it fits.
          if (( $(df -Pk / | awk 'NR == 2 {print $4}') < 12 * 1024 * 1024 )); then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          fi
          df -h /
      - name: Install Bevy's Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}, wasm32-wasip2
      # Same key as the release build: a pull request reads the default branch's saved cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: artifacts-${{ matrix.target }}
          cache-workspace-crates: true
      - name: Build and package
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: bash dev/scripts/build-artifacts.sh native-mods "$BUILD_TARGET"
      - name: Smoke packaged native executables
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: python3 dev/scripts/smoke-native-artifacts.py target/artifacts "$BUILD_TARGET"
      - name: Build and package ray-tracing game
        if: (runner.os == 'Linux' || runner.os == 'Windows') && github.event_name == 'pull_request'
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: bash dev/scripts/build-artifacts.sh native-raytracing "$BUILD_TARGET"
      - name: Smoke packaged ray-tracing game
        if: (runner.os == 'Linux' || runner.os == 'Windows') && github.event_name == 'pull_request'
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: python3 dev/scripts/smoke-native-artifacts.py target/artifacts "$BUILD_TARGET" --raytracing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-${{ matrix.target }}
          path: |
            target/artifacts/cyrus-${{ matrix.target }}*
            target/artifacts/cyrus-with-mods-${{ matrix.target }}*
            target/artifacts/cyrus-viewer-${{ matrix.target }}*
            target/artifacts/cyrus-raytracing-${{ matrix.target }}*
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ github.event_name == 'push' && 3 || 7 }}

  web:
    if: github.event_name == 'pull_request'
    # Four jobs use the hosted runner's cores while the swap file below absorbs linker peaks.
    env:
      CARGO_BUILD_JOBS: 4
    name: Browser bundles
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Add swap for parallel link-time optimization
        run: |
          sudo fallocate -l 12G /swapfile-cyrus
          sudo chmod 600 /swapfile-cyrus
          sudo mkswap /swapfile-cyrus
          sudo swapon /swapfile-cyrus
          free -h
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: artifacts-web
          cache-workspace-crates: true
      - name: Read wasm-bindgen version
        id: bindgen
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, ""); print $3 }' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - name: Install matching wasm-bindgen
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
      - name: Build and package
        run: bash dev/scripts/build-artifacts.sh web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser
          path: target/artifacts/cyrus-browser.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
