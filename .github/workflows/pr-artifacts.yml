name: PR artifacts

# The native and browser builds of release.yml, for every pull request. Download them from the run
# summary to try a change; nothing is published.
on:
  pull_request:

concurrency:
  group: pr-artifacts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

jobs:
  native:
    name: Native (${{ matrix.target }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          # Keep Intel builds independent of the ARM hosted-runner capacity pool.
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Free Linux disk space
        if: runner.os == 'Linux'
        run: |
          # Keep 12 GiB for compilation; avoid minutes of SDK removal when it fits.
          if (( $(df -Pk / | awk 'NR == 2 {print $4}') < 12 * 1024 * 1024 )); then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          fi
          df -h /
      - name: Install Bevy's Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      # Same key as the release build: a pull request reads the default branch's saved cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: artifacts-${{ matrix.target }}
          cache-workspace-crates: true
      - name: Build and package
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: bash dev/scripts/build-artifacts.sh native "$BUILD_TARGET"
      - name: Smoke native executables
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          suffix=""
          if [[ "$RUNNER_OS" = Windows ]]; then suffix=.exe; fi
          for app in cyrus cyrus-viewer; do
            binary="target/$BUILD_TARGET/release/$app$suffix"
            if [[ -f "$binary" ]]; then "$binary" --help; fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-${{ matrix.target }}
          path: |
            target/artifacts/cyrus-${{ matrix.target }}*
            target/artifacts/cyrus-viewer-${{ matrix.target }}*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  web:
    # Four jobs use the hosted runner's cores while the swap file below absorbs linker peaks.
    env:
      CARGO_BUILD_JOBS: 4
    name: Browser bundles
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Add swap for parallel link-time optimization
        run: |
          sudo fallocate -l 12G /swapfile-cyrus
          sudo chmod 600 /swapfile-cyrus
          sudo mkswap /swapfile-cyrus
          sudo swapon /swapfile-cyrus
          free -h
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: artifacts-web
          cache-workspace-crates: true
      - name: Read wasm-bindgen version
        id: bindgen
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, ""); print $3 }' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - name: Install matching wasm-bindgen
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
      - name: Build and package
        run: bash dev/scripts/build-artifacts.sh web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser
          path: target/artifacts/cyrus-browser.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
