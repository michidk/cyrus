name: Build artifacts

on:
  push:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and attach to a draft release (blank for Actions artifacts)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: artifacts-${{ github.event_name }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

jobs:
  native:
    name: Native (${{ matrix.target }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Free Linux disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install Bevy's Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: artifacts-${{ matrix.target }}
          cache-workspace-crates: true
      - name: Build and package
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: bash dev/scripts/build-artifacts.sh native "$BUILD_TARGET"
      - name: Smoke native executables
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          suffix=""
          if [[ "$RUNNER_OS" = Windows ]]; then suffix=.exe; fi
          for app in cyrus cyrus-viewer; do
            binary="target/$BUILD_TARGET/release/$app$suffix"
            if [[ -f "$binary" ]]; then "$binary" --help; fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: |
            target/artifacts/cyrus-${{ matrix.target }}.tar.gz
            target/artifacts/cyrus-viewer-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  web:
    name: Browser bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: artifacts-web
          cache-workspace-crates: true
      - name: Install matching wasm-bindgen
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, ""); print $3 }' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build and package
        run: bash dev/scripts/build-artifacts.sh web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser
          path: target/artifacts/cyrus-browser.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Attach release assets
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.release_tag != ''
    needs: [native, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" ./*.tar.gz SHA256SUMS --clobber
