name: Deploy released browser

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-released-browser
  cancel-in-progress: false

env:
  TAG_NAME: ${{ inputs.tag || github.event.release.tag_name }}

defaults:
  run:
    shell: bash

jobs:
  pages:
    # Deploy only after the release is complete; the site is the released browser bundle.
    name: Deploy browser build to GitHub Pages
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.TAG_NAME }}
          persist-credentials: false
          sparse-checkout: |
            dev/pages
            .github/workflows/cyrus-banner.webp
          sparse-checkout-cone-mode: false
      - name: Download published browser bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$TAG_NAME" --pattern cyrus-browser.tar.gz --dir bundle
      - name: Assemble site
        # Shared engine files stay at the root so one service worker covers game/ and viewer/.
        run: |
          tar -xzf bundle/cyrus-browser.tar.gz -C bundle
          mv bundle/browser site
          mkdir site/game site/viewer
          sed 's|<head>|<head><base href="../">|' site/index.html > site/game/index.html
          sed 's|<head>|<head><base href="../">|' site/viewer.html > site/viewer/index.html
          grep -q '<base href="../">' site/game/index.html site/viewer/index.html
          rm site/viewer.html
          cp dev/pages/index.html dev/pages/*.webp .github/workflows/cyrus-banner.webp site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

