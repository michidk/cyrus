name: Test & Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTFLAGS: "-D warnings"
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

jobs:
  packaging-macos:
    name: Package with macOS Bash
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check native packaging with the system shell
        run: >-
          python3 dev/scripts/test-build-artifacts.py
          ArtifactTest.test_native_platforms_and_optional_viewer
          ArtifactTest.test_mod_bundle_delivers_launcher_beside_game_on_each_platform
          ArtifactTest.test_raytracing_packages_preserve_standard_downloads
          ArtifactTest.test_build_failure_produces_no_archive

  test:
    name: Test Suite
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The debug build of the workspace fills the hosted runner's disk; the
      # linker then dies with a bus error. Drop the preinstalled SDKs first.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Install Bevy's Linux libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test
          cache-workspace-crates: true

      - name: Test
        env:
          RUST_MIN_STACK: 8388608
        run: cargo test --workspace --all-features

  lints:
    name: Lints
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Bevy's Linux libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: lints
          cache-workspace-crates: true

      - name: Run publish-check
        run: dev/scripts/publish-check.sh

      - name: Require a published preservation release
        run: |
          python3 -B dev/scripts/test-preservation-release.py
          python3 -B dev/scripts/check-preservation-release.py

      - name: Check the generated map
        run: dev/scripts/genmap.sh --check

      - name: Check artifact packaging
        run: |
          python3 dev/scripts/test-build-artifacts.py
          python3 dev/scripts/test-smoke-native-artifacts.py

      - name: Check browser file selection and asset transport
        run: |
          node dev/scripts/test-local-install.mjs
          node dev/scripts/test-game-assets.mjs

      - name: Check build and capture provenance
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pil
          python3 dev/scripts/test-build-provenance.py
          python3 dev/scripts/test-cargo-wrapper.py
          python3 dev/scripts/test-original-startup-capture.py
          python3 dev/scripts/test-native-startup-capture.py
          python3 dev/scripts/test-retro-capture-runtime.py
          python3 dev/scripts/test-ensure-runtime-image.py
          python3 dev/scripts/test-native-book-capture.py
          node --test dev/scripts/capture-provenance.test.mjs dev/scripts/browser-provenance.test.mjs dev/scripts/matched-capture.test.mjs

      - name: Check surface audio
        run: python3 -B dev/scripts/test-surface-audio.py

      - name: Check portable core boundaries
        run: dev/scripts/check-core-boundaries.sh

      - name: Run cargo fmt
        run: cargo fmt --all -- --check --color always

      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  web:
    name: Browser build
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown

      # This plugin should be loaded after toolchain setup
      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Proves the install/thread/socket code stays behind cfg(not(wasm32)).
      - name: Check both applications for wasm32
        run: cargo check -p cyrus-web -p cyrus-viewer -p cyrus-assets-worker --target wasm32-unknown-unknown
