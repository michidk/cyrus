name: Test & Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full immutable candidate commit SHA to verify
        required: true
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}-${{ inputs.source_commit || 'automatic' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTFLAGS: "-D warnings"
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

jobs:
  source:
    name: Admit immutable source
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Validate source commit
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_COMMIT: ${{ github.sha }}
          CANDIDATE_COMMIT: ${{ inputs.source_commit }}
        run: |
          requested="$EVENT_COMMIT"
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            requested="$CANDIDATE_COMMIT"
          fi
          if [[ ! "$requested" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'source_commit must be a full lowercase commit SHA' >&2
            exit 1
          fi
          printf 'commit=%s\n' "$requested" >> "$GITHUB_OUTPUT"

  packaging-macos:
    needs: source
    name: Package with macOS Bash
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Verify immutable checkout
        env:
          EXPECTED_COMMIT: ${{ needs.source.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - name: Check native packaging with the system shell
        run: dev/scripts/gates.sh packaging-macos

  test:
    needs: source
    name: Test Suite
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Verify immutable checkout
        env:
          EXPECTED_COMMIT: ${{ needs.source.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      # The debug build of the workspace fills the hosted runner's disk; the
      # linker then dies with a bus error. Drop the preinstalled SDKs first.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Install Bevy's Linux libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test
          cache-workspace-crates: true

      - name: Test
        env:
          RUST_MIN_STACK: 8388608
          CYRUS_TEST_MESSAGES: ${{ runner.temp }}/test-messages.jsonl
        run: dev/scripts/gates.sh test

      - name: Preserve install-backed session regression executable
        env:
          EXPECTED_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          mkdir -p "$RUNNER_TEMP/original-runtime-test"
          python3 dev/scripts/collect-test-executable.py \
            "$RUNNER_TEMP/test-messages.jsonl" original_runtime \
            "$RUNNER_TEMP/original-runtime-test/original-runtime-test"
          git rev-parse HEAD > "$RUNNER_TEMP/original-runtime-test/source-sha.txt"
          sha256sum "$RUNNER_TEMP/original-runtime-test/original-runtime-test" > "$RUNNER_TEMP/original-runtime-test/executable-sha256.txt"
          python3 dev/scripts/artifact_provenance.py \
            "$RUNNER_TEMP/original-runtime-test" "$EXPECTED_COMMIT" --file original-runtime-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: original-runtime-test-linux
          path: ${{ runner.temp }}/original-runtime-test/
          retention-days: 7

      - name: Export workspace installed-test executables
        env:
          EXPECTED_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/test-metadata.json"
          cargo test --locked --workspace --all-features --no-run --message-format=json > "$RUNNER_TEMP/test-no-run.jsonl"
          python3 dev/scripts/collect-test-executable.py --bundle collect \
            "$RUNNER_TEMP/test-no-run.jsonl" "$RUNNER_TEMP/test-metadata.json" \
            "$RUNNER_TEMP/workspace-tests" "$EXPECTED_COMMIT"
          python3 dev/scripts/artifact_provenance.py \
            "$RUNNER_TEMP/workspace-tests" "$EXPECTED_COMMIT" --file manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: workspace-tests-linux
          path: ${{ runner.temp }}/workspace-tests/
          compression-level: 0
          retention-days: 7

  lints:
    needs: source
    name: Lints
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Verify immutable checkout
        env:
          EXPECTED_COMMIT: ${{ needs.source.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Install Bevy's Linux libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: lints
          cache-workspace-crates: true

      - name: Install script test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pil python3-numpy python3-scipy python3-blake3

      - name: Run script checks, formatting, boundaries and Clippy
        run: dev/scripts/gates.sh lints

  web:
    needs: source
    name: Browser build
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Verify immutable checkout
        env:
          EXPECTED_COMMIT: ${{ needs.source.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown

      # This plugin should be loaded after toolchain setup
      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Proves the install/thread/socket code stays behind cfg(not(wasm32)).
      - name: Check both applications for wasm32
        run: cargo check -p cyrus-web -p cyrus-viewer -p cyrus-assets-worker --target wasm32-unknown-unknown
