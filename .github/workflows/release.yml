name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG_NAME: ${{ github.ref_name }}
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Validate release tag
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" || ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Select a stable vX.Y.Z release tag.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install Bevy's Linux libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify workspace versions match tag
        run: |
          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          versions="$(jq -er '.workspace_members as $members | [.packages[] | select(.id as $id | $members | index($id)) | .version] | unique | join("\n")' <<< "$metadata")"
          if [[ "$versions" != "${TAG_NAME#v}" ]]; then
            printf '::error::Workspace versions %s do not match tag %s.\n' "$versions" "$TAG_NAME"
            exit 1
          fi
      - name: Run gates
        run: bash dev/scripts/gates.sh

  native:
    needs: verify
    name: Native (${{ matrix.target }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Free Linux disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install Bevy's Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: artifacts-${{ matrix.target }}
          cache-workspace-crates: true
      - name: Build and package
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: bash dev/scripts/build-artifacts.sh native "$BUILD_TARGET"
      - name: Smoke native executables
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          suffix=""
          if [[ "$RUNNER_OS" = Windows ]]; then suffix=.exe; fi
          for app in cyrus cyrus-viewer; do
            binary="target/$BUILD_TARGET/release/$app$suffix"
            if [[ -f "$binary" ]]; then "$binary" --help; fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: |
            target/artifacts/cyrus-${{ matrix.target }}.tar.gz
            target/artifacts/cyrus-viewer-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  web:
    # Keep concurrent compilation and whole-program linking within hosted-runner memory.
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_WASM_RELEASE_LTO: thin
    needs: verify
    name: Browser bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: artifacts-web
          cache-workspace-crates: true
      - name: Install matching wasm-bindgen
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, ""); print $3 }' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build and package
        run: /usr/bin/time -v bash dev/scripts/build-artifacts.sh web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser
          path: target/artifacts/cyrus-browser.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: [native, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate release changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --current --strip header --output CHANGELOG.md
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum -- * > SHA256SUMS

      - name: Create release with all packages and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_state="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" |
            jq -r --arg tag "$TAG_NAME" '.[] | select(.tag_name == $tag) | .draft')"
          if [[ "$release_state" == "false" ]]; then
            echo 'Release is already published; leaving it unchanged.'
            exit 0
          elif [[ "$release_state" == "true" ]]; then
            gh release upload "$TAG_NAME" artifacts/* --clobber
            gh release edit "$TAG_NAME" --notes-file CHANGELOG.md
          else
            gh release create "$TAG_NAME" artifacts/* --verify-tag --draft \
              --title "${TAG_NAME#v}" --notes-file CHANGELOG.md
          fi
          gh release edit "$TAG_NAME" --draft=false

  pages:
    # Deploy only after the release is complete; the site is the released browser bundle.
    name: Deploy browser build to GitHub Pages
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download browser bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: browser
          path: bundle
      - name: Unpack site
        run: tar -xzf bundle/cyrus-browser.tar.gz -C bundle
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: bundle/browser
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
