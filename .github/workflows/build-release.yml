name: Build release artifacts

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

env:
  TAG_NAME: ${{ inputs.tag }}
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify release (${{ matrix.stage }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        stage: [lints, test]
    env:
      # Match CI so release verification can restore its compiled dependencies.
      RUSTFLAGS: "-D warnings"
      RUST_BACKTRACE: short
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.TAG_NAME }}
          persist-credentials: false
      - name: Free disk space
        run: |
          # Keep 12 GiB for compilation; avoid minutes of SDK removal when it fits.
          if (( $(df -Pk / | awk 'NR == 2 {print $4}') < 12 * 1024 * 1024 )); then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          fi
          df -h /
      - name: Install Bevy's Linux libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ${{ matrix.stage }}
          cache-workspace-crates: true
      - name: Verify workspace versions match tag
        run: |
          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          versions="$(jq -er '.workspace_members as $members | [.packages[] | select(.id as $id | $members | index($id)) | .version] | unique | join("\n")' <<< "$metadata")"
          if [[ "$versions" != "${TAG_NAME#v}" ]]; then
            printf '::error::Workspace versions %s do not match tag %s.\n' "$versions" "$TAG_NAME"
            exit 1
          fi
      - name: Run gates
        env:
          GATE_STAGE: ${{ matrix.stage }}
          RUST_MIN_STACK: 8388608
        run: bash dev/scripts/gates.sh "$GATE_STAGE"

  # Builds start alongside verify; publishing still requires it.
  native:
    name: Native (${{ matrix.target }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          # Keep Intel builds independent of the ARM hosted-runner capacity pool.
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.TAG_NAME }}
          persist-credentials: false
      - name: Install current Bash on macOS
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install bash
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
      - name: Free Linux disk space
        if: runner.os == 'Linux'
        run: |
          # Keep 12 GiB for compilation; avoid minutes of SDK removal when it fits.
          if (( $(df -Pk / | awk 'NR == 2 {print $4}') < 12 * 1024 * 1024 )); then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          fi
          df -h /
      - name: Install Bevy's Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}, wasm32-wasip2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: artifacts-${{ matrix.target }}
          cache-workspace-crates: true
      - name: Build and package
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: bash dev/scripts/build-artifacts.sh native-mods "$BUILD_TARGET"
      - name: Smoke packaged native executables
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: python3 dev/scripts/smoke-native-artifacts.py target/artifacts "$BUILD_TARGET"
      - name: Build and package ray-tracing game
        if: runner.os == 'Linux' || runner.os == 'Windows'
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: bash dev/scripts/build-artifacts.sh native-raytracing "$BUILD_TARGET"
      - name: Smoke packaged ray-tracing game
        if: runner.os == 'Linux' || runner.os == 'Windows'
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: python3 dev/scripts/smoke-native-artifacts.py target/artifacts "$BUILD_TARGET" --raytracing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-native-${{ matrix.target }}
          path: |
            target/artifacts/cyrus-${{ matrix.target }}*
            target/artifacts/cyrus-with-mods-${{ matrix.target }}*
            target/artifacts/cyrus-viewer-${{ matrix.target }}*
            target/artifacts/cyrus-raytracing-${{ matrix.target }}*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  web:
    # Four jobs use the hosted runner's cores while the swap file below absorbs linker peaks.
    env:
      CARGO_BUILD_JOBS: 4
    name: Browser bundles
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.TAG_NAME }}
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Add swap for parallel link-time optimization
        run: |
          sudo fallocate -l 12G /swapfile-cyrus
          sudo chmod 600 /swapfile-cyrus
          sudo mkswap /swapfile-cyrus
          sudo swapon /swapfile-cyrus
          free -h
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: artifacts-web
          cache-workspace-crates: true
      - name: Read wasm-bindgen version
        id: bindgen
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, ""); print $3 }' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - name: Install matching wasm-bindgen
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
      - name: Build and package
        run: /usr/bin/time -v bash dev/scripts/build-artifacts.sh web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-browser
          path: target/artifacts/cyrus-browser.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

