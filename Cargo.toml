[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["dev/vendor/smk"]
# cyrus-web only matters for `just web`; keep day-to-day builds and tests lean.
default-members = ["crates/cyrus-assets", "crates/cyrus-world", "crates/cyrus-collision", "crates/cyrus-script", "crates/cyrus-render", "crates/cyrus", "crates/cyrus-game", "crates/cyrus-control", "crates/cyrus-mcp", "crates/cyrus-text", "crates/cyrus-media", "crates/cyrus-audio", "crates/cyrus-startup"]

[workspace.package]
version = "0.1.1"
edition = "2024"
repository = "https://github.com/michidk/cyrus"

[workspace.dependencies]
bevy = { version = "0.20", default-features = false, features = ["std", "async_executor", "multi_threaded", "serialize"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
toml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
smk = { version = "0.1", path = "dev/vendor/smk" }
redguard-preservation = { git = "https://github.com/michidk/redguard-preservation", rev = "ddbe29fb3283cfe8a2e4f70bd85a8492384d828f" }
cyrus-control = { path = "crates/cyrus-control" }
cyrus-world = { path = "crates/cyrus-world" }
cyrus-collision = { path = "crates/cyrus-collision" }
cyrus-render = { path = "crates/cyrus-render" }
cyrus-media = { path = "crates/cyrus-media" }
cyrus-audio = { path = "crates/cyrus-audio" }
cyrus-startup = { path = "crates/cyrus-startup" }
cyrus-assets = { path = "crates/cyrus-assets" }
cyrus-script = { path = "crates/cyrus-script" }
cyrus-game = { path = "crates/cyrus-game" }
cyrus-text = { path = "crates/cyrus-text" }

# The inspector's Bevy 0.20 port uses an egui fork; share our released adapter instead.
[patch."https://github.com/taboky-dev/bevy_egui.git"]
bevy_egui = { version = "=0.43.0" }

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.test]
debug = 0

# Movie packet decoding must keep pace with playback in development builds too.
[profile.dev.package.smk]
opt-level = 3
