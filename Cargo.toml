[workspace]
resolver = "3"
members = ["crates/*"]
# cyrus-web only matters for `just web`; keep day-to-day builds and tests lean.
default-members = ["crates/cyrus", "crates/cyrus-game", "crates/cyrus-control", "crates/cyrus-mcp", "crates/cyrus-text"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/michidk/cyrus"

[workspace.dependencies]
bevy = { version = "0.20", features = ["serialize"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
redguard-preservation = { git = "https://github.com/michidk/redguard-preservation", rev = "4ad5e824d1ec5b957cba485d0453a539e36a5701" }
cyrus-control = { path = "crates/cyrus-control" }
cyrus-game = { path = "crates/cyrus-game" }
cyrus-text = { path = "crates/cyrus-text" }

# The inspector's Bevy 0.20 port uses an egui fork; share our released adapter instead.
[patch."https://github.com/taboky-dev/bevy_egui.git"]
bevy_egui = { version = "=0.43.0" }

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.test]
debug = 0
