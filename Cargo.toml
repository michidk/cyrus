[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["dev/vendor/smk", "dev/vendor/rodio", "dev/vendor/cpal"]
# cyrus-web only matters for `just web`; keep day-to-day builds and tests lean.
default-members = ["crates/cyrus-assets", "crates/cyrus-mods", "crates/cyrus-world", "crates/cyrus-collision", "crates/cyrus-soup", "crates/cyrus-render", "crates/cyrus", "crates/cyrus-game", "crates/cyrus-script", "crates/cyrus-console", "crates/cyrus-control", "crates/cyrus-mcp", "crates/cyrus-text", "crates/cyrus-config", "crates/cyrus-media", "crates/cyrus-audio", "crates/cyrus-startup"]

[workspace.package]
version = "0.9.0"
edition = "2024"
repository = "https://github.com/michidk/cyrus"

[workspace.dependencies]
bevy = { version = "0.20", default-features = false, features = ["std", "async_executor", "multi_threaded", "serialize"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
toml = "1.0"
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
smk = { version = "0.1", path = "dev/vendor/smk" }
redguard-preservation = { git = "https://github.com/michidk/redguard-preservation", rev = "be16375b4fe6805832d060cd0031df00dfb561a3" }
cyrus-console = { path = "crates/cyrus-console" }
cyrus-control = { path = "crates/cyrus-control" }
cyrus-world = { path = "crates/cyrus-world" }
cyrus-collision = { path = "crates/cyrus-collision" }
cyrus-render = { path = "crates/cyrus-render" }
cyrus-session = { path = "crates/cyrus-session" }
cyrus-media = { path = "crates/cyrus-media" }
cyrus-audio = { path = "crates/cyrus-audio" }
cyrus-startup = { path = "crates/cyrus-startup" }
cyrus-assets = { path = "crates/cyrus-assets" }
cyrus-soup = { path = "crates/cyrus-soup" }
cyrus-game = { path = "crates/cyrus-game" }
cyrus-script = { path = "crates/cyrus-script" }
cyrus-text = { path = "crates/cyrus-text" }
cyrus-config = { path = "crates/cyrus-config" }

[patch.crates-io]
# The published bitmap2ttf still uses SystemTime::now, which panics on WASM.
bitmap2ttf = { git = "https://github.com/michidk/bitmap2ttf", rev = "6801e76ffee2edf96f3086ec70cd163cd6984081" }
cpal = { path = "dev/vendor/cpal" }
rodio = { path = "dev/vendor/rodio" }


# Thin LTO keeps downloads small; parallel codegen avoids the single-unit build bottleneck.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 16
strip = true

# Keep a separate local profile for development overrides.
[profile.wasm-dev]
inherits = "wasm-release"

# Backtraces keep file and line; full variable debug info mostly slows linking.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = 0

# Movie packet decoding must keep pace with playback in development builds too.
[profile.dev.package.smk]
opt-level = 3
